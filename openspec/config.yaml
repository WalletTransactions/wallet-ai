schema: spec-driven

context: |
  Все артефакты OpenSpec пишутся на русском.
  wallet-ai — единая точка доступа к LLM (LM Studio на хосте разработчика, GTX 1070 8 ГБ,
  модели до 8B Q4, контекст ~4096 токенов). C++17, cpp-httplib, общий код — вендоренный
  wallet-common (third_party/, правится только в репозитории wallet-common + scripts/vendor.sh).
  Инвариант: wallet-ai НИЧЕГО не пишет в кошелёк — отдаёт черновики; запись делает клиент
  (веб, бот) после подтверждения пользователя через POST /sync/push в wallet-api.
  Всё, что зовёт LLM, — асинхронные задания; GPU один (LLM_MAX_CONCURRENT=1),
  интерактивная очередь важнее фоновой.
  Внешний трафик — через wallet-gateway под /api/ai/*; JWT google-auth (aud wallet-ai, scope ai:use).
  В другие сервисы ходит токеном пользователя (wallet-report — только чтение).
  Приватность: в логах только id, kind, статусы и длительности — без текста пользователя и результатов.
  openapi.yaml — источник правды по форме запросов/ответов; спеки описывают поведение.

rules:
  specs:
    - Не дублировать JSON-схемы из openapi.yaml — ссылаться на путь/operationId
    - Каждое требование — с хотя бы одним сценарием WHEN/THEN
  design:
    - Явно указывать правки в других сервисах (wallet-infra, wallet-gateway, google-auth, wallet-common, клиенты)
    - Оценивать нагрузку на GPU (токены на запрос, число запросов, время на GTX 1070)
  tasks:
    - Новое поведение — с юнит-тестами (tests/, FakeLlm) и, где нужен стек, интеграционным прогоном
    - Изменение API сопровождается правкой openapi.yaml и README.md
    - Сборка и тесты — в Docker, по одному сервису за раз
