openapi: 3.1.0
info:
  title: wallet-ai
  version: "0.2.0"
  description: |
    Единая точка доступа к LLM (`org/docs/TODO_wallet_ai.md`): разбор трат
    текстом, импорт выписок, чат с инструментами. **Ничего не пишет в
    кошелёк** — возвращает черновики, запись делает клиент после
    подтверждения пользователя.

    Токен — access JWT google-auth: `aud` содержит `wallet-ai`, `scope` —
    `ai:use`. Токен без `aud` (старого формата) не принимается.

    Через `wallet-gateway` (порт 8090) — префикс `/api/ai/*`; бот ходит
    напрямую. Ниже — прямой адрес сервиса.
servers:
  - url: http://localhost:8087
    description: Прямой адрес сервиса (по умолчанию, см. .env.example — PORT)

tags:
  - name: ai
    description: LLM-функции
  - name: imports
    description: Импорт банковских выписок
  - name: docs
    description: "Эта спека, Swagger UI, healthcheck, метрики, версия — не часть API"

security:
  - bearerAuth: []
  - sessionCookie: []

paths:
  /api/ai/status:
    get:
      operationId: aiStatus
      summary: Включён ли ИИ и что он умеет
      description: |
        Веб по `enabled` показывает или прячет пункт «ИИ», бот — строку про
        свободный текст в `/help`. `enabled` — LLM настроена (`LLM_URL`) и
        последняя проба (`GET {LLM_URL}/models`, раз в
        `LLM_PROBE_INTERVAL_SECS`) нашла модель `LLM_MODEL`.
      tags: [ai]
      responses:
        "200":
          description: Состояние
          content:
            application/json:
              schema:
                type: object
                required: [enabled, model, reason, features]
                properties:
                  enabled: {type: boolean}
                  model:
                    type: [string, "null"]
                    description: id модели; null, если ИИ выключен
                    example: wallet-parse
                  reason:
                    type: [string, "null"]
                    description: почему выключен; null, если включён
                    enum: [disabled, unreachable, unauthorized, model_not_loaded, bad_response, null]
                  features:
                    type: array
                    description: |
                      Что сейчас можно: `parse_expense` — при включённом ИИ,
                      `statement_import` — ещё и база ai отвечает, `chat` —
                      ещё и заданы `WALLET_MCP_URL` и `AUTH_EXCHANGE_SECRET`.
                      Чат через Claude работает и при выключенной LM Studio —
                      см. `GET /api/ai/settings`.
                    items: {type: string, enum: [parse_expense, statement_import, chat]}
        "401":
          description: Нет токена, подпись не сошлась, токен просрочен, выпущен не для wallet-ai или старого формата
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: В токене нет scope `ai:use`
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/ai/jobs:
    post:
      operationId: createJob
      summary: Создать задание к LLM (асинхронно)
      description: |
        Всё, что зовёт LLM, — задания: модель думает столько, сколько нужно
        виду задания, клиент забирает результат long-poll'ом
        (`GET /api/ai/jobs/{id}?wait=25`). Справочник счетов берётся токеном
        пользователя в момент создания.

        Виды (`kind`):
        - `parse_expense` — трата свободным текстом в проверенный черновик
          (`ParseExpenseInput` → `ParseExpenseResult`). Запись черновика —
          дело клиента (`POST /sync/push` в wallet-api) после подтверждения
          пользователем. Всегда LM Studio: при выключенной — `503 unavailable`.
        - `chat` — вопрос о кошельке обычными словами (`ChatInput` →
          `ChatResult`). Ответ собирает агентный цикл: модель просит
          инструменты wallet-mcp (только чтение), сервис их исполняет и
          возвращает результаты модели — не больше `AI_CHAT_MAX_STEPS` (5)
          вызовов модели и `AI_JOB_TIMEOUT_SECS_CHAT` (120 с). Провайдер —
          выбранный пользователем на момент создания (`GET /api/ai/settings`),
          без молчаливой подмены. При создании токен пользователя
          обменивается в google-auth на токен для wallet-mcp; он живёт только
          во входе задания в памяти и в ответы не попадает.

        `idempotency_key` — повтор с тем же ключом от того же пользователя
        возвращает то же задание без нового запуска LLM (бот:
        `tg:<tg_user_id>:<update_id>`).
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, input]
              properties:
                kind: {type: string, enum: [parse_expense, chat]}
                idempotency_key: {type: string}
                input:
                  oneOf:
                    - $ref: "#/components/schemas/ParseExpenseInput"
                    - $ref: "#/components/schemas/ChatInput"
      responses:
        "202":
          description: Задание создано (или найдено по idempotency_key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {type: string, format: uuid}
                  status: {type: string, enum: [queued, running, done, failed, cancelled]}
        "400":
          description: "Неизвестный kind или неверный input; `unknown_kind` — extract_rows/classify_rows создаёт только сам сервис"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: "Нет токена / не для wallet-ai / wallet-report не принял токен; `invalid_token` — google-auth отказал в обмене токена для wallet-mcp (chat)"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Нет scope `ai:use`
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: "`busy` — очередь полна, `rate_limited` — больше LLM_MAX_PER_MINUTE за минуту, `too_many_active` — больше AI_MAX_ACTIVE_PER_USER незавершённых"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "502":
          description: wallet-report недоступен
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: |
            - `unavailable` — `parse_expense`: ИИ выключен или LLM не отвечает,
              клиент уходит на строгий формат; `chat`: не заданы
              `WALLET_MCP_URL`/`AUTH_EXCHANGE_SECRET` или google-auth недоступен;
            - `provider_unavailable` (`chat`) — выбранный провайдер сейчас
              недоступен, в `provider` — его id. Задание не создаётся.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, enum: [unavailable, provider_unavailable]}
                  provider: {type: string, enum: [lmstudio, claude], description: При provider_unavailable}

  /api/ai/settings:
    get:
      operationId: getAiSettings
      summary: Настройки ИИ — провайдер чата и согласия
      description: |
        Выбранный провайдер и список провайдеров с доступностью для этого
        пользователя. Без сохранённого выбора (или без базы ai) —
        `AI_DEFAULT_PROVIDER` (`lmstudio`). Ключей провайдеров в ответе нет.
      tags: [ai]
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiSettings"}
        "401":
          description: Нет токена или он не для wallet-ai
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Нет scope `ai:use`
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      operationId: putAiSettings
      summary: Выбрать провайдера чата, дать или отозвать согласие
      description: |
        Облачный провайдер (`claude`) выбирается только с согласием на
        передачу данных: результаты инструментов (суммы, категории,
        комментарии операций) уходят в Anthropic. Согласие передаётся
        `consent: true` один раз и хранится в базе ai. `consent: false` —
        отзыв: согласие стирается, а если провайдер был выбран, выбор
        переходит на `AI_DEFAULT_PROVIDER`.
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: {type: string, enum: [lmstudio, claude]}
                consent: {type: boolean, description: "true — согласие на передачу данных облачному провайдеру, false — отзыв"}
            examples:
              claude: {value: {provider: claude, consent: true}}
              revoke: {value: {provider: claude, consent: false}}
      responses:
        "200":
          description: Новые настройки
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiSettings"}
        "400":
          description: "`provider_unavailable` — неизвестный или недоступный этому пользователю провайдер; `bad_request` — тело не объект или `consent` не boolean"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Нет токена или он не для wallet-ai
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Нет scope `ai:use`
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: "`consent_required` — облачный провайдер без сохранённого или переданного `consent: true`; выбор не меняется"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: "`settings_unavailable` — нет `DATABASE_URL` или база ai не отвечает"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/ai/jobs/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getJob
      summary: Статус и результат задания (long-poll)
      description: |
        `wait` (0–25 с) — держать запрос, пока задание не завершится, но не
        дольше `wait`. Не готово — `200` со `status: queued/running`, клиент
        повторяет. Завершённое задание хранится `AI_JOB_TTL_SECS` (10 мин),
        потом — 404.
      tags: [ai]
      parameters:
        - {in: query, name: wait, schema: {type: integer, minimum: 0, maximum: 25, default: 0}}
      responses:
        "200":
          description: Снимок задания
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404":
          description: Нет, истекло или чужое (не 403 — не выдаём, что такой id есть)
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      operationId: cancelJob
      summary: Отменить задание
      description: Ещё в очереди — снимается; выполняется — сразу `cancelled`, результат генерации выбрасывается.
      tags: [ai]
      responses:
        "204": {description: Отменено}
        "404":
          description: Нет, истекло, чужое или уже завершено
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/ai/imports:
    post:
      operationId: createImport
      summary: Импорт банковской выписки (асинхронно)
      description: |
        Текст выписки или файл (`.pdf` с текстовым слоем, `.csv`, `.txt` до
        5 МБ, base64) и кошелёк. Ответ сразу — `202 {import_id}`, разбор идёт
        в фоне: LLM извлекает строки по фрагментам, код проверяет суммы и
        даты по исходнику, затем категории — правила пользователя и LLM.
        Клиент опрашивает `GET /api/ai/imports/{id}`. Ничего не пишется в
        кошелёк: готовые операции клиент шлёт в `POST /sync/push` сам.

        PDF без текстового слоя (скан) — импорт создаётся сразу в `failed`
        с `failure: no_text`; текст без единой строки с суммой (не выписка,
        нечитаемая кодировка) — с `failure: no_operations`. CSV, для
        которого есть встроенный профиль с колонками (Wirex), разбирается
        кодом без LLM: импорт сразу переходит к категориям, `progress` разбора
        нет. Не больше одного импорта в работе на пользователя и
        `AI_IMPORTS_MAX_ACTIVE` всего.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_uuid]
              description: Ровно один источник — text или file.
              properties:
                wallet_uuid: {type: string, format: uuid, description: Живой неархивный кошелёк; его валюта — валюта выписки}
                text: {type: string, description: Вставленный текст выписки}
                source_name: {type: string, description: Имя для списка, если источник — text}
                file:
                  type: object
                  required: [name, content_base64]
                  properties:
                    name: {type: string, example: statement.pdf}
                    content_base64: {type: string, description: Стандартный base64 или base64url}
                profile:
                  type: string
                  default: auto
                  description: "`auto`, `none`, id встроенного профиля или своего формата (GET /api/ai/statement-profiles)"
      responses:
        "202":
          description: Импорт создан
          content:
            application/json:
              schema:
                type: object
                required: [import_id, status]
                properties:
                  import_id: {type: string, format: uuid}
                  status: {type: string, enum: [queued, failed]}
                  failure: {type: string, enum: [no_text, no_operations]}
        "400":
          description: "`one_source`, `empty`, `unknown_wallet`, `unknown_profile`, `unsupported_file`, `bad_base64`, `bad_request`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Нет токена / не для wallet-ai / wallet-report не принял токен
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "413":
          description: "`too_large` — файл больше 5 МБ, текст больше 300 000 символов или 80 фрагментов: разбейте по месяцам"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: "`import_in_progress` (+ `import_id` текущего) или `busy` — в работе AI_IMPORTS_MAX_ACTIVE импортов"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  import_id: {type: string, format: uuid}
        "502":
          description: wallet-report недоступен
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: "`unavailable` — база ai не отвечает или импорт не настроен"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      operationId: listImports
      summary: Импорты пользователя, новые первыми (без строк)
      tags: [imports]
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports: {type: array, items: {$ref: "#/components/schemas/Import"}}
        "503":
          description: "`unavailable`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/ai/imports/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getImport
      summary: Статус, прогресс, а в ready/done — строки, группы и готовые операции
      description: |
        Для `ready` строки сверяются с операциями кошелька
        (`GET /api/reports/operations` токеном запроса, период ±2 дня):
        `exists` — та же сумма, дата ±1 день, кандидат единственный;
        `possible_duplicate` — кандидатов несколько; `imported` — отпечаток
        уже записан раньше. Сверка кэшируется на минуту; `?reconcile=1` —
        заново. wallet-report недоступен — `reconciled: false`.
      tags: [imports]
      parameters:
        - {in: query, name: reconcile, schema: {type: string, enum: ["1"]}}
      responses:
        "200":
          description: Импорт
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportDetail"}
        "404":
          description: Нет, истёк или чужой
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      operationId: deleteImport
      summary: Отменить разбор и удалить импорт со строками и текстом
      description: Отпечатки уже записанных строк остаются.
      tags: [imports]
      responses:
        "204": {description: Удалён}
        "404":
          description: Нет или чужой
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/ai/imports/{id}/retry:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: retryImport
      summary: Продолжить failed-импорт с первого неразобранного фрагмента
      tags: [imports]
      responses:
        "202": {description: Разбор продолжается}
        "404":
          description: Нет или чужой
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: "`not_retryable` — не failed, `no_text` или `no_operations`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: "`import_in_progress`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/ai/imports/{id}/rows:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: patchImportRows
      summary: Правки строк пачкой (все или ни одной)
      description: |
        Категория создаёт или обновляет правило продавца и ставится остальным
        строкам с тем же `pattern`, если их категорию не выбирал
        пользователь. Сумма снимает `amount_not_in_text`/`currency_mismatch`,
        дата — `date_not_in_text`. Правка суммы, даты или направления
        добавляет пример в свой формат пользователя.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    required: [row_id]
                    properties:
                      row_id: {type: string, format: uuid}
                      category_uuid: {type: [string, "null"]}
                      amount: {type: string, description: Положительная, «1290.00»}
                      date: {type: string, description: ГГГГ-ММ-ДД, не в будущем}
                      dir: {type: string, enum: [expense, income, transfer]}
                      comment: {type: [string, "null"], maxLength: 255}
                      decision: {type: [string, "null"], enum: [include, skip, duplicate, null]}
      responses:
        "200":
          description: Импорт после правок
          content: {application/json: {schema: {$ref: "#/components/schemas/ImportDetail"}}}
        "400":
          description: "`unknown_row`, `unknown_category`, `bad_amount`, `bad_date`, `bad_dir`, `bad_decision`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: "`not_ready` или `row_committed`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      operationId: addImportRow
      summary: Строка вручную из «не разобрано»
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line, amount, date]
              properties:
                line: {type: integer, description: Номер строки исходника}
                amount: {type: string}
                date: {type: string}
                category_uuid: {type: string}
                description: {type: string, description: По умолчанию — текст строки}
                comment: {type: string}
      responses:
        "201":
          description: "Импорт со строкой (`source: manual`)"
          content: {application/json: {schema: {$ref: "#/components/schemas/ImportDetail"}}}
        "400":
          description: "`bad_line`, `bad_amount`, `bad_date`, `unknown_category`"
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /api/ai/imports/{id}/committed:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: commitImportRows
      summary: Отметить записанные строки
      description: |
        Клиент записал операции через `POST /sync/push` и отмечает их строки:
        отпечатки уходят в `statement_imported`, строки больше не меняются.
        Записаны или отклонены все строки — импорт `done` и хранится ещё
        `AI_IMPORT_DONE_TTL_DAYS` дней.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_ids]
              properties:
                row_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Импорт после отметки
          content: {application/json: {schema: {$ref: "#/components/schemas/ImportDetail"}}}

  /api/ai/statement-profiles:
    get:
      operationId: listStatementProfiles
      summary: Встроенные профили и свои форматы пользователя
      tags: [imports]
      responses:
        "200":
          description: Профили для формы загрузки
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [id, name, kind]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        kind: {type: string, enum: [builtin, own]}
                        examples: {type: integer, description: У своего формата}

  /api/ai/statement-profiles/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    patch:
      operationId: renameStatementProfile
      summary: Переименовать свой формат
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200": {description: Переименован}
        "403":
          description: Встроенный профиль не меняется
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Нет или чужой
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      operationId: deleteStatementProfile
      summary: Удалить свой формат с примерами
      tags: [imports]
      responses:
        "204": {description: Удалён}
        "403":
          description: Встроенный профиль не удаляется
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Нет или чужой
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /docs:
    get:
      operationId: docs
      summary: "Swagger UI поверх /openapi.yaml"
      tags: [docs]
      security: []
      responses:
        "200":
          description: HTML-страница Swagger UI
          content:
            text/html: {schema: {type: string}}

  /openapi.yaml:
    get:
      operationId: openApiYaml
      summary: "Эта спецификация"
      tags: [docs]
      security: []
      responses:
        "200":
          description: Текст этого файла
          content:
            application/yaml: {schema: {type: string}}

  /healthz:
    get:
      operationId: healthz
      summary: "Liveness для compose healthcheck — LLM не проверяет (она необязательна)"
      tags: [docs]
      security: []
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}

  /metrics:
    get:
      operationId: metrics
      summary: "Prometheus: http-метрики, jwt_claims_total, llm_up"
      tags: [docs]
      security: []
      responses:
        "200":
          description: Текстовый формат Prometheus
          content:
            text/plain: {schema: {type: string}}

  /version:
    get:
      operationId: version
      summary: "Версия этого билда (VERSION + git-хэш)"
      tags: [docs]
      security: []
      responses:
        "200":
          description: Версия и git-хэш
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: {type: string, example: wallet-ai}
                  version: {type: string, example: "0.1.0"}
                  git_commit: {type: string, example: "a1b2c3d4"}
                  build: {type: string, example: "0.1.1-rc.2", description: "Тег образа (--build-arg APP_BUILD); сборка без него — <VERSION>-dev"}
                  started_at: {type: string, format: date-time, example: "2026-11-03T19:24:28Z", description: "Время запуска процесса, UTC"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access-токен google-auth (aud wallet-ai, scope ai:use), проверяется по JWKS."
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  schemas:
    Error:
      type: object
      properties:
        error: {type: string}

    Job:
      type: object
      required: [job_id, kind, status]
      properties:
        job_id: {type: string, format: uuid}
        kind: {type: string, enum: [parse_expense, chat], example: parse_expense}
        status: {type: string, enum: [queued, running, done, failed, cancelled]}
        queue_ms: {type: integer, description: Сколько ждало в очереди}
        run_ms: {type: integer, description: Сколько выполнялось}
        failure:
          type: string
          description: |
            При failed. Для `chat` ещё: `tools_unavailable` — wallet-mcp
            недоступен или ответил 503; `auth_expired` — wallet-mcp ответил
            401 (токен обмена истёк); `provider_auth_failed` — провайдер
            отклонил ключ; `provider_refused` — модель отказалась отвечать;
            `unavailable` — провайдер недоступен (сеть, 429, 5xx).
          enum: [timeout, unavailable, bad_response, internal, tools_unavailable, auth_expired, provider_auth_failed, provider_refused]
        result:
          description: При done; для parse_expense — ParseExpenseResult, для chat — ChatResult
          oneOf:
            - $ref: "#/components/schemas/ParseExpenseResult"
            - $ref: "#/components/schemas/ChatResult"

    ParseExpenseInput:
      type: object
      required: [text, now]
      properties:
        text: {type: string, maxLength: 500, example: "вчера такси 450 с тинькоффа"}
        now:
          type: object
          description: Сейчас в поясе пользователя — от него считаются «вчера», «в пятницу»
          required: [date, time]
          properties:
            date: {type: string, example: "2026-10-11"}
            time: {type: string, example: "14:05:00"}
        default_wallet_uuid: {type: string, description: Кошелёк по умолчанию, если кошелёк не назван}

    ChatInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Вопрос пользователя, 1..1000 байт UTF-8. В журнал не пишется.
          example: сколько я потратил на няню в сентябре?
        conversation_id:
          type: string
          pattern: "^[A-Za-z0-9_:-]{1,64}$"
          description: |
            Диалог: следующее задание с тем же id получает прежние пары
            «вопрос — ответ» (не больше `AI_CHAT_HISTORY_TURNS`, 30 минут от
            последнего обращения). История — у каждого пользователя своя.
            Нет — сервис создаёт новый и возвращает его в результате.
          example: tg-42-1
        now:
          type: object
          description: Сейчас в поясе пользователя — для «в этом месяце», «вчера». Нет — UTC сервера.
          required: [date, time]
          properties:
            date: {type: string, example: "2026-11-04"}
            time: {type: string, example: "14:05:00"}

    ChatResult:
      type: object
      required: [text, conversation_id, provider, steps, tools]
      properties:
        text: {type: string, description: Ответ модели обычным текстом, example: "За сентябрь 2026 на няню ушло 42 000 RUB."}
        conversation_id: {type: string, description: Из входа или новый, example: tg-42-1}
        provider: {type: string, enum: [lmstudio, claude]}
        steps: {type: integer, description: Число вызовов модели, example: 2}
        tools:
          type: array
          description: Имена вызванных инструментов wallet-mcp по порядку
          items: {type: string}
          example: [spending_by_category]

    AiSettings:
      type: object
      required: [provider, providers]
      properties:
        provider:
          type: string
          enum: [lmstudio, claude]
          description: Провайдер, которым пойдут новые задания chat
        providers:
          type: array
          items:
            type: object
            required: [id, title, cloud, available, requires_consent, consented, consented_at]
            properties:
              id: {type: string, enum: [lmstudio, claude]}
              title: {type: string, example: "Claude (Anthropic)"}
              cloud: {type: boolean, description: Данные уходят во внешнее облако}
              available: {type: boolean}
              reason:
                type: string
                description: |
                  Есть, только если недоступен: `not_configured` — не задан
                  `LLM_URL`/`ANTHROPIC_API_KEY`; `not_allowed` — пользователя
                  нет в `ANTHROPIC_ALLOWED_USERS`; для `lmstudio` — результат
                  пробы LLM (`unreachable`, `model_not_loaded`, ...).
              requires_consent: {type: boolean}
              consented: {type: boolean}
              consented_at: {type: [string, "null"], format: date-time, description: Когда дано согласие}

    ParseExpenseResult:
      type: object
      required: [outcome, prompt_version]
      properties:
        outcome:
          type: string
          enum: [draft, not_expense, rejected]
          description: |
            draft — черновик (expense + resolution); not_expense — модель не
            нашла трату; rejected — проверки не прошли (reasons), клиент
            предлагает строгий формат.
        prompt_version: {type: string, example: expense-v2}
        confidence: {type: number}
        reasons:
          type: array
          description: При rejected
          items: {type: string, enum: [bad_amount, zero_amount, amount_not_in_text, bad_date, future_date, too_old]}
        notes:
          type: array
          description: При draft — что поправлено (currency_dropped, comment_truncated)
          items: {type: string}
        expense:
          type: object
          description: Тот же ParsedExpense, что у строгого формата бота
          properties:
            amount: {type: string, example: "1200.5"}
            fraction_digits: {type: integer}
            currency_hint: {type: string, example: EUR}
            category: {type: string, description: имя из справочника или пусто}
            wallet: {type: string}
            datetime: {type: string, example: "2026-10-10 12:00:00"}
            comment: {type: string}
        resolution:
          type: object
          description: Решение resolver — какие счета (uuid) или кого спросить
          properties:
            category:
              type: object
              properties:
                kind: {type: string, enum: [found, ask]}
                why: {type: string, enum: [none, missing, not_found, ambiguous]}
                found: {$ref: "#/components/schemas/Named"}
                candidates: {type: array, items: {$ref: "#/components/schemas/Named"}}
            wallet:
              type: object
              properties:
                kind: {type: string, enum: [found, ask, reject]}
                why:
                  type: string
                  enum: [none, not_given, not_found, ambiguous, currency_mismatch, no_wallet_in_currency, no_wallets]
                by_currency: {type: boolean, description: выбран по валюте из текста — назвать в карточке}
                offer_remember: {type: boolean}
                found: {$ref: "#/components/schemas/Wallet"}
                force: {$ref: "#/components/schemas/Wallet"}
                candidates: {type: array, items: {$ref: "#/components/schemas/Wallet"}}

    Named:
      type: object
      properties:
        uuid: {type: string}
        name: {type: string}

    Wallet:
      type: object
      properties:
        uuid: {type: string}
        name: {type: string}
        iso_code: {type: string}
        symbol: {type: string}
        precision: {type: integer}

    Import:
      type: object
      required: [import_id, status, wallet_uuid, created_at, expires_at]
      properties:
        import_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, extracting, classifying, ready, done, failed, cancelled]}
        failure: {type: [string, "null"], enum: [no_text, no_operations, timeout, unavailable, null]}
        wallet_uuid: {type: string, format: uuid}
        source_name: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Когда удалится по текущим правилам; при done пересчитывается}
        period:
          type: [object, "null"]
          properties:
            from: {type: string}
            to: {type: string}
        progress:
          type: object
          description: В extracting — по фрагментам, в classifying — по пачкам
          properties:
            done: {type: integer}
            total: {type: integer}
        paused_since: {type: string, format: date-time, description: LLM недоступна — разбор на паузе}
        profile:
          type: [object, "null"]
          properties:
            id: {type: string}
            name: {type: string}
            source: {type: string, enum: [auto, manual]}
        profile_detect: {type: [string, "null"], enum: [none, ambiguous, null]}
        counts:
          type: object
          description: Только в списке (GET /api/ai/imports) и только в ready/done; без сверки с внесёнными
          properties:
            rows: {type: integer, description: Всего строк импорта}
            ready: {type: integer, description: Готовы к записи (группа ready, не skip, не записаны)}
            committed: {type: integer, description: Записаны}

    ImportDetail:
      allOf:
        - $ref: "#/components/schemas/Import"
        - type: object
          description: rows, groups, unparsed, operations — только в ready и done
          properties:
            reconciled: {type: boolean}
            groups:
              type: object
              description: Число строк в каждой группе
              properties:
                ready: {type: integer}
                needs_category: {type: integer}
                possible_duplicate: {type: integer}
                check: {type: integer}
                exists: {type: integer}
                imported: {type: integer}
                income_transfer: {type: integer}
                unparsed: {type: integer}
            rows: {type: array, items: {$ref: "#/components/schemas/ImportRow"}}
            unparsed:
              type: array
              description: Строки исходника с суммой, которые не вошли ни в одну подтверждённой строку
              items:
                type: object
                properties:
                  n: {type: integer}
                  text: {type: string}
            operations:
              type: array
              description: Готовые операции для POST /sync/push — строки группы ready, не skip и не записанные
              items:
                type: object
                properties:
                  uuid: {type: string, format: uuid, description: UUID v5 от отпечатка — повторная загрузка даёт тот же}
                  row_id: {type: string, format: uuid}
                  date: {type: string, example: "2026-09-12 12:00:00"}
                  acc_fr_uuid: {type: string, format: uuid, description: Кошелёк импорта}
                  acc_to_uuid: {type: string, format: uuid, description: Категория}
                  amount: {type: string, example: "450.00"}
                  comment: {type: string, maxLength: 255}

    ImportRow:
      type: object
      properties:
        row_id: {type: string, format: uuid}
        group: {type: string, enum: [ready, needs_category, possible_duplicate, check, exists, imported, income_transfer]}
        lines:
          type: array
          description: Строки-источники выписки
          items:
            type: object
            properties:
              n: {type: integer}
              text: {type: string}
        date: {type: string}
        amount: {type: string}
        dir: {type: string, enum: [expense, income, transfer]}
        currency: {type: string}
        description: {type: string}
        pattern: {type: string, example: YANDEX*GO}
        comment: {type: [string, "null"]}
        category_uuid: {type: [string, "null"]}
        source: {type: [string, "null"], enum: [rule, llm, user, manual, null]}
        suggestion: {type: [string, "null"], description: Вариант модели ниже порога уверенности}
        check: {type: [string, "null"], enum: [amount_not_in_text, date_not_in_text, currency_mismatch, null]}
        match: {type: [string, "null"], enum: [exists, possible_duplicate, imported, null]}
        match_candidates: {type: [array, "null"], items: {type: object}}
        decision: {type: [string, "null"], enum: [include, skip, duplicate, null]}
        edited: {type: boolean}
        committed: {type: boolean}
